<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%APP_NAME% admin</title>
<style>
  body { margin: 0; background: #fff; color: #111; font: 14px/1.5 system-ui, sans-serif; }
  #admin { max-width: 44rem; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  h2 { font-size: 1.05rem; margin: 2rem 0 0.5rem; }
  label { display: block; margin: 0.6rem 0 0.2rem; }
  input { display: block; font: inherit; padding: 0.3rem 0.4rem; width: 100%; max-width: 24rem; box-sizing: border-box; }
  button, a.download { font: inherit; padding: 0.35rem 0.8rem; margin: 0.6rem 0.5rem 0 0; display: inline-block; }
  a.download { border: 1px solid #555; border-radius: 4px; color: inherit; text-decoration: none; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid #ddd; }
  td button { margin: 0 0.3rem 0 0; padding: 0.15rem 0.5rem; }
  .note { padding: 0.6rem 0.8rem; border-left: 3px solid #b80; background: #fff8e6; }
  #admin-message { min-height: 1.5em; font-weight: 600; }
  .muted { color: #555; }
</style>
</head>
<body>
<main id="admin"></main>
<script type="module" src="/@runtime/admin/main.ts"></script>
</body>
</html>
