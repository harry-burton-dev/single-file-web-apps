name: Release
# Push a tag like v1.2.0 to publish a GitHub Release holding workbench-1.2.0.zip:
# the Workbench folder (bootstrap, app bundle, signed manifest) ready to copy
# into the shared folder. Needs the repository variable WORKBENCH_PUBLIC_KEY
# and the secret WORKBENCH_SIGNING_KEY (see workbench/scripts/keygen.js).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync engine tests
        working-directory: sync-engine
        run: |
          npm ci
          npm test
      - name: Workbench tests
        working-directory: workbench
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm run typecheck
          npm test
      - name: From-disk smoke test
        working-directory: workbench
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run smoke
      - name: Build and sign the release
        working-directory: workbench
        env:
          WORKBENCH_PUBLIC_KEY: ${{ vars.WORKBENCH_PUBLIC_KEY }}
          WORKBENCH_SIGNING_KEY: ${{ secrets.WORKBENCH_SIGNING_KEY }}
        run: |
          npm run release
          cd dist/release && zip -r "workbench-${GITHUB_REF_NAME#v}.zip" Workbench
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" workbench/dist/release/workbench-*.zip --title "Workbench ${GITHUB_REF_NAME#v}" --generate-notes
