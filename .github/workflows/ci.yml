name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Install, typecheck, tests and build. A created project runs the same script.
      - name: CI
        run: npm run ci
      - name: Browser for the smoke test
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      # Red until TR2 to TR5 land; see docs/framework/README.md section 3.
      - name: Rubric
        run: npm run rubric
