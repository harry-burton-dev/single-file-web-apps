name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync engine tests
        working-directory: sync-engine
        run: |
          npm ci
          npm test
      - name: Workbench typecheck, tests and build
        working-directory: workbench
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build:app
