name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Engine and runtime tests
        run: npm test
      - name: Adversarial probes (G10)
        run: npm run probes
      - name: Typecheck
        run: npm run typecheck
      - name: Build with size budgets (G11)
        # The bootstrap needs a public key; a throwaway one, as the smoke test uses.
        run: |
          export TRELLIS_PUBLIC_KEY="$(npm run --silent keygen | sed -n 's/^TRELLIS_PUBLIC_KEY=//p')"
          npm run build
      - name: No fixed test key in the build
        run: npm run check:no-test-key
